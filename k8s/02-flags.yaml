apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-config
  namespace: flags
data:
  PORT: "8002"
  # DNS interno do cluster, cruzando namespace
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: flags
  labels:
    app: flag-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: 370366393519.dkr.ecr.us-east-1.amazonaws.com/flag-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-config
            - secretRef:
                name: flag-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: flags
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
