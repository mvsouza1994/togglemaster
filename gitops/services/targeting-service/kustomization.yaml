apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - db-migrate-job.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: togglemaster
      app.kubernetes.io/name: targeting-service

# SQL do schema (copia de services/targeting-service/db/init.sql) para o Job de migracao.
# Tambem e hook PreSync, com wave menor, para existir antes do Job.
configMapGenerator:
  - name: targeting-db-schema
    namespace: targeting
    files:
      - schema.sql
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-1"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
