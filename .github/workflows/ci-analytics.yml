# CI/DevSecOps do analytics-service
name: ci-analytics

on:
  pull_request:
    branches: [main]
    paths:
      - services/analytics-service/**
      - .github/workflows/ci-analytics.yml
      - .github/workflows/_ci-python.yml
      - .github/workflows/_image.yml
  push:
    branches: [main]
    paths:
      - services/analytics-service/**
      - .github/workflows/ci-analytics.yml
      - .github/workflows/_ci-python.yml
      - .github/workflows/_image.yml
  workflow_dispatch:

permissions:
  contents: read

# um pipeline por branch; em PR cancela o anterior, na main deixa terminar
concurrency:
  group: ci-analytics-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_ci-python.yml
    with:
      service: analytics-service

  image:
    needs: ci
    uses: ./.github/workflows/_image.yml
    with:
      service: analytics-service
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
