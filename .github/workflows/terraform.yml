# Infraestrutura (Terraform) pelo GitHub Actions.
#   - pull_request / push na main (terraform/**): fmt, validate e plan
#   - Actions > terraform > Run workflow: escolhe plan, apply ou destroy
#
# AWS Academy: as credenciais expiram a cada sessao do lab. A cada Start Lab, atualize os
# secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN (scripts/gh-aws-secrets.sh).
name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

# nunca dois terraform ao mesmo tempo no mesmo state
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STATE_BUCKET: fiap-bucket-state-tf-grupo3

defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    name: Terraform ${{ inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Credenciais AWS (Academy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Conta AWS em uso
        run: aws sts get-caller-identity --query Account --output text

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # O bucket do state precisa existir antes do init. Feito com AWS CLI porque no
      # Academy o provider aws do Terraform falha ao criar bucket (a SCP do lab nega
      # s3:GetBucketObjectLockConfiguration, que o provider le apos criar). Idempotente.
      - name: Bucket do state (cria se nao existir)
        run: |
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "bucket $STATE_BUCKET ja existe"
          else
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
          fi
          aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        if: inputs.action != 'destroy'
        run: terraform plan -out tfplan

      - name: terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply tfplan

      - name: Outputs
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: |
          {
            echo "## Infra criada"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # O NLB do ingress-nginx e criado pelo Kubernetes, fora do Terraform, e trava a
      # remocao da VPC. Apaga o LoadBalancer antes do destroy se o cluster existir.
      - name: Remover LoadBalancers do Kubernetes
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: |
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || true)
          if [ -n "$CLUSTER" ] && aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
            kubectl delete application -n argocd platform-ingress-nginx --ignore-not-found --wait=false || true
            kubectl get svc -A -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' |
              while read -r ns name; do kubectl delete svc -n "$ns" "$name" --ignore-not-found || true; done
            sleep 60
          fi

      - name: terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve
