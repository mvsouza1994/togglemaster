name: ci-flag

on:
  pull_request:
    branches: [main]
    paths:
      - services/flag-service/**
      - .github/workflows/ci-flag.yml
      - .github/workflows/_ci-python.yml
      - .github/workflows/_image.yml
      - .github/workflows/_gitops.yml
  push:
    branches: [main]
    paths:
      - services/flag-service/**
      - .github/workflows/ci-flag.yml
      - .github/workflows/_ci-python.yml
      - .github/workflows/_image.yml
      - .github/workflows/_gitops.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-flag-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/_ci-python.yml
    with:
      service: flag-service

  image:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      service: flag-service
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  gitops:
    needs: image
    if: needs.image.outputs.image-uri != ''
    permissions:
      contents: write
    uses: ./.github/workflows/_gitops.yml
    with:
      service: flag-service
      image: ${{ needs.image.outputs.image-uri }}
