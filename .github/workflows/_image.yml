name: _image

on:
  workflow_call:
    inputs:
      service:
        description: "Pasta do servico e nome do repositorio ECR (togglemaster/<service>)"
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
    outputs:
      image-tag:
        description: "Tag publicada (v1.0.0-<sha curto>)"
        value: ${{ jobs.docker.outputs.image-tag }}
      image-uri:
        description: "Imagem completa publicada (vazio em PR)"
        value: ${{ jobs.docker.outputs.image-uri }}

permissions:
  contents: read
  packages: write

env:
  AWS_REGION: us-east-1
  TRIVY_IMAGE: aquasec/trivy:0.76.0

jobs:
  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      image-uri: ${{ steps.push.outputs.uri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Definir tag (v1.0.0-<sha curto>) e destino
        id: meta
        env:
          REGISTRY_VAR: ${{ vars.REGISTRY }}
        run: |
          PUBLISH=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            PUBLISH=true
          fi
          {
            echo "tag=v1.0.0-${GITHUB_SHA::7}"
            echo "local=togglemaster/${{ inputs.service }}:v1.0.0-${GITHUB_SHA::7}"
            echo "registry=${REGISTRY_VAR:-ghcr}"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: services/${{ inputs.service }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.local }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Container scan - Trivy (relatorio HIGH, nao bloqueia)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}"
          image --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0
          ${{ steps.meta.outputs.local }}

      - name: Container scan - Trivy (CRITICAL bloqueia o pipeline)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}"
          image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          ${{ steps.meta.outputs.local }}

      - name: Login no GHCR
        if: steps.meta.outputs.publish == 'true' && steps.meta.outputs.registry == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Credenciais AWS (AWS Academy - secrets do lab)
        if: steps.meta.outputs.publish == 'true' && steps.meta.outputs.registry == 'ecr'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        if: steps.meta.outputs.publish == 'true' && steps.meta.outputs.registry == 'ecr'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Push da imagem
        if: steps.meta.outputs.publish == 'true'
        id: push
        env:
          REGISTRY_KIND: ${{ steps.meta.outputs.registry }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REGISTRY_KIND" = "ecr" ]; then
            BASE="$ECR_REGISTRY/togglemaster"
          else
            BASE="ghcr.io/${REPO,,}"
          fi
          URI="$BASE/${{ inputs.service }}:${{ steps.meta.outputs.tag }}"
          docker tag "${{ steps.meta.outputs.local }}" "$URI"
          docker push "$URI"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"
          echo "Imagem publicada: \`$URI\`" >> "$GITHUB_STEP_SUMMARY"
