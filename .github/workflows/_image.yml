# Workflow reutilizavel: build da imagem, scan com Trivy e push para o ECR.
# Em pull_request so faz build + scan. O push acontece apenas em push na main.
name: _image

on:
  workflow_call:
    inputs:
      service:
        description: "Pasta do servico e nome do repositorio ECR (togglemaster/<service>)"
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
    outputs:
      image-tag:
        description: "Tag publicada (v1.0.0-<sha curto>)"
        value: ${{ jobs.docker.outputs.image-tag }}
      image-uri:
        description: "Imagem completa publicada no ECR (vazio em PR)"
        value: ${{ jobs.docker.outputs.image-uri }}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TRIVY_IMAGE: aquasec/trivy:0.76.0

jobs:
  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      image-uri: ${{ steps.push.outputs.uri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir tag (v1.0.0-<sha curto>)
        id: meta
        run: |
          echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "local=togglemaster/${{ inputs.service }}:v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build da imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ inputs.service }}
          load: true # deixa a imagem no docker local para o scan
          push: false
          tags: ${{ steps.meta.outputs.local }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Container scan - Trivy (relatorio HIGH, nao bloqueia)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}"
          image --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0
          ${{ steps.meta.outputs.local }}

      # --ignore-unfixed: so bloqueia o que tem correcao disponivel
      # (CVE sem patch na imagem base nao tem o que o time fazer)
      - name: Container scan - Trivy (CRITICAL bloqueia o pipeline)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}"
          image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          ${{ steps.meta.outputs.local }}

      # ---------- daqui para baixo so roda em push na main ----------
      # e com a variavel do repositorio ECR_PUSH=true (liga depois do terraform apply
      # e de cadastrar os secrets AWS_* do lab; antes disso o CI so builda e escaneia)
      - name: Credenciais AWS (AWS Academy - secrets do lab)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ECR_PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ECR_PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Publica exatamente a imagem que passou no scan.
      # So a tag do commit: o ECR e IMMUTABLE, entao nao usamos "latest".
      - name: Push para o ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ECR_PUSH == 'true'
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          URI="$REGISTRY/togglemaster/${{ inputs.service }}:${{ steps.meta.outputs.tag }}"
          docker tag "${{ steps.meta.outputs.local }}" "$URI"
          docker push "$URI"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"
          echo "Imagem publicada: \`$URI\`" >> "$GITHUB_STEP_SUMMARY"

      # TODO (Parte 3 - GitOps): aqui entra o passo que atualiza a tag da imagem
      # em gitops/ (kustomize/yq) e faz commit com [skip ci]. Por enquanto sem deploy.
